[project]
name = "async-human-approval-gate"
version = "0.1.0"
description = "A small Python component that pauses an agent workflow until a human approves or rejects an action."
readme = "README.md"
requires-python = ">=3.11"
dependencies = []

[tool.uv]
package = false

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"

[dependency-groups]
dev = [
    "fastapi>=0.162.0",
    "httpx>=0.28.1",
    "hypothesis>=6.170.13",
    "pytest>=9.2.0",
    "pytest-asyncio>=1.4.1",
    "uvicorn[standard]>=0.54.0",
]
