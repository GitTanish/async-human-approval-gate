[project]
name = "async-human-approval-gate"
version = "0.1.0"
description = "A small Python component that pauses an agent workflow until a human approves or rejects an action."
readme = "README.md"
requires-python = ">=3.11"
dependencies = []

[project.scripts]
approval-gate = "approval_gate.cli:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/approval_gate"]

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "function"
pythonpath = ["."]

[dependency-groups]
dev = [
    "fastapi>=0.162.0",
    "httpx>=0.28.1",
    "hypothesis>=6.170.13",
    "pytest>=9.2.0",
    "pytest-asyncio>=1.4.1",
    "uvicorn[standard]>=0.54.0",
]
